server:
  port: 8778
short-url:
  # 必须与 domain_conf 中启用的 domain_value 一致。
  default-domain: ${SHORT_URL_DOMAIN:localhost:8778}
  outbox:
    enabled: true
    fixed-delay-ms: 2000 # 上一轮结束后间隔2秒再扫描
    initial-delay-ms: 5000
    batch-size: 20
    confirm-timeout-ms: 5000
spring:
  application:
    name: ShortURL
  profiles:
    active: dev
  rabbitmq:
    host: 192.168.249.186
    port: 5672
    virtual-host: /
    username: admin
    password: 123456
    publisher-confirm-type: correlated
    publisher-returns: true
    connection-timeout: 3s
    listener:
      simple:
        acknowledge-mode: auto
        prefetch: 1
        default-requeue-rejected: false
        retry:
          enabled: true
          stateless: true
          max-attempts: 3
          initial-interval: 1000ms
          max-interval: 5000ms
          multiplier: 2
  data:
    redis:
      host: 192.168.249.186
      port: 6378
      password:
      lettuce:
        pool:
          max-active: 10
          max-idle: 10
          min-idle: 1
          time-between-eviction-runs: 10s
  jackson:
    default-property-inclusion: non_null # JSON处理时忽略非空字段
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/shortURL?serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=utf-8&zeroDateTimeBehavior=convertToNull&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: 123456

# knife4j配置
knife4j:
  enable: true
# springdoc-openapi项目配置
springdoc:
  # 禁用扫描@ControllerAdvice的泛型响应，避免Spring Framework 6.2.x的ControllerAdviceBean构造器不兼容
  override-with-generic-response: false
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
  group-configs:
    - group: 'default'
      paths-to-match: '/**'
      packages-to-scan: com.zxyy.controller
